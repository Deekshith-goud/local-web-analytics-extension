name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Audit & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Lint
        run: bun run lint

      - name: Run Security Audit & Extension Packaging
        run: bun run package

      - name: Generate Release Notes
        id: notes
        run: |
          echo "## Local Browse Analytics Release" > release_notes.md
          echo "This release was built and packaged automatically by the CI pipeline." >> release_notes.md
          echo "All builds are cryptographically verified and checked against the zero-telemetry policy." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Release Fingerprint (\`release-manifest.json\`)" >> release_notes.md
          echo "\`\`\`json" >> release_notes.md
          cat build/chrome-mv3-prod/release-manifest.json >> release_notes.md
          echo "\`\`\`" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            build/chrome-mv3-prod.zip
            build/chrome-mv3-prod/release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
